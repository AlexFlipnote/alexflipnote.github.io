<!DOCTYPE html>
<html lang="en">
  <head>
    <x-html src="partials/head.html"/>
    <x-seo title="Playground" description="Silly projects that I made for fun"/>
  </head>
  <body class="dark-theme github">

    <style>
      .playground-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1rem;
        width: 90%;
      }

      .playground-item {
        align-items: center;
        background-color: #282828;
        border-radius: .25rem;
        border: 1px solid #303030;
        display: flex;
        filter: drop-shadow(5px 5px 0 #000);
        justify-content: center;
        padding-top: 1rem;
        padding-bottom: 1rem;
        color: white;
        font-weight: bold;
        letter-spacing: .1rem;
        transition: filter 0.2s ease-in-out;
      }

      .playground-item:hover {
        filter: drop-shadow(2px 2px 0 #000);
        transition: filter 0.1s ease-in-out;
      }

      @media (max-width: 48rem) {
        .playground-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>

    <div class="container">
      <h1>Playground experiments:</h1>
      <div class="playground-grid">
        <x-each items="playground" as="name">
        <a class="playground-item" href="/playground/{{ name }}/">{{ name }}</a>
        </x-each>
      </div>
    </div>
  </body>
</html>

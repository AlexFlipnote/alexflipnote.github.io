<!DOCTYPE html>
<html lang="en" class="auto-theme">
  <head>
    <x-html src="partials/head.html"/>
    <title>404: Page not found</title>
  </head>
  <body class="monospace">
    <section class="fullscreen">
      <div class="center-object text-center">
        <h1 class="lost-title bold no-margin">
          <span class="alizarin-text">HTTP 404</span>
          <br>
          Page not found<span class="cursor">_</span>
        </h1>
        <div class="flex-grid notfound-container">
          <a class="notfound-btn emerald-bg black-text" href="/">Back to home</a>
          <a class="notfound-btn peter-river-bg black-text" href="#" onclick="history.back(); return false;">Go one step back</a>
        </div>
      </div>
    </section>

    <script>
      document.querySelector("[data-lost-path]").textContent = decodeURIComponent(location.pathname.replace(/^\/|\/$/g, "")) || "???"
    </script>
  </body>
</html>

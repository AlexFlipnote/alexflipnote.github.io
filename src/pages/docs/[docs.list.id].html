<!DOCTYPE html>
<html lang="en" class="auto-theme">
  <head>
    <x-html src="partials/head.html"/>
    <x-seo title="{{ page.title }}" description="{{ page.description }}" section="Docs" name="{{ page.title }}"/>
  </head>
  <body class="github page">
    <x-html src="partials/navbar.html"/>

    <div class="page-content">
      <main class="paper-container">
        <article class="paper markdown-jekyll">
          <header class="doc-head text-center">
            <h1>{{ page.title }}</h1>
            <p class="italic">{{ page.description }}</p>
          </header>
          <div class="doc-split">
            <hr>
            <div class="doc-labels">
              <span class="label">📅 {{ page.dateText }}</span>
              <span class="label">⏱ {{ page.readingTime }}</span>
              <span class="label">📝 {{ page.author }}</span>
            </div>
          </div>
          {{{ page.html }}}
        </article>
      </main>

      <x-html src="partials/footer.html"/>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="en" class="auto-theme">
  <head>
    <x-html src="partials/head.html"/>
    <x-seo title="Documentations" description="Documentations that I made for anyone else to use"/>
  </head>
  <body class="github page">
    <x-html src="partials/navbar.html"/>

    <div class="page-content">
      <main class="container">
        <h1 class="title emerald-text">Docs</h1>
        <p class="lede">Documentations that I made for anyone else to use, written down so I don't have to explain it twice.</p>

        <x-each items="docs.months" as="month">
        <h2 class="subtitle">{{ month.month }}</h2>
        <x-each items="month.docs" as="doc">
        <article class="box-container primary-bg tile doc" id="{{ doc.listId }}">
          <div>
            <a class="tile-title" href="/docs/{{ doc.id }}/">{{ doc.title }}</a>
            <p class="tile-desc">{{ doc.description }}</p>
          </div>
          <div class="doc-labels">
            <span class="label">📅 {{ doc.listDate }}</span>
            <span class="label">⏱ {{ doc.readingTime }}</span>
          </div>
        </article>
        </x-each>
        </x-each>
      </main>

      <x-html src="partials/footer.html"/>
    </div>
  </body>
</html>
